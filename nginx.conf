# nginx para Cloud Run: sirve las páginas ya armadas de sitio/.
# URLs limpias: /hierros sirve hierros.html directo (sin barra final y sin redirección).

# Caché según el tipo de archivo. CSS y JS llevan ?v=<huella> en el HTML
# (lo agrega construir.py), así que se pueden guardar un año.
map $sent_http_content_type $indartubo_cache {
    default                  "no-cache";
    ~*text/css               "public, max-age=31536000, immutable";
    ~*javascript             "public, max-age=31536000, immutable";
    ~*font/                  "public, max-age=31536000, immutable";
    ~*image/                 "public, max-age=2592000";
}

server {
    listen 8080;                       # puerto por defecto de Cloud Run
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    charset_types text/css application/javascript application/xml text/plain;
    server_tokens off;
    absolute_redirect off;             # redirecciones relativas (Cloud Run está detrás de un proxy https)

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain application/json;

    add_header Cache-Control $indartubo_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Página de error con el estilo del sitio (sitio/404.html). Siempre con código 404.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        # noindex también por encabezado (además del <meta> de la página). Un add_header
        # acá anula los del server, así que se repiten.
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /404 { return 404; }

    # Home
    location = / { try_files /index.html =404; }

    # Quien entre con .html (o /index) va a la URL limpia, con 301.
    location = /index.html { return 301 /; }
    location = /index      { return 301 /; }
    location ~ ^(?<limpia>/.+)\.html$ { return 301 $limpia$is_args$args; }

    # Barra final sobrante: /hierros/ -> /hierros
    location ~ ^(?<sinbarra>/.+)/$ { return 301 $sinbarra$is_args$args; }

    # Páginas y archivos: /hierros -> hierros.html.
    # Sin "$uri/" a propósito: así nginx nunca agrega la barra final.
    location / { try_files $uri $uri.html =404; }
}
